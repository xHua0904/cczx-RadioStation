services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radio_submissions
      POSTGRES_USER: ${DB_USER:-radio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请先在 .env 设置 DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d radio_submissions"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    profiles: ["full"]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/radio_submissions
      DB_USER: ${DB_USER:-radio}
      DB_PASSWORD: ${DB_PASSWORD:?请先在 .env 设置 DB_PASSWORD}
      SUBMISSIONS_PER_MINUTE: ${SUBMISSIONS_PER_MINUTE:-20}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      PORT: ${PORT:-80}
      LOG_DIR: /app/logs
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    ports:
      - "${PORT:-80}:${PORT:-80}"
    volumes:
      - app-data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  app-data:
