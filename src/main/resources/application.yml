server:
  port: ${PORT:80}
  max-http-request-header-size: 16KB
  tomcat:
    basedir: ${LOG_DIR:./logs}/tomcat
    accesslog:
      enabled: true
      directory: .
      prefix: access
      suffix: .log
      max-days: 30
      pattern: '%t %a "%m %U %H" %s %b %D'
logging:
  file:
    name: ${LOG_DIR:./logs}/springboot.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:./logs}/springboot.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
      clean-history-on-start: true
spring:
  application:
    name: cczx-RadioStation
  datasource:
    url: ${DB_URL:jdbc:sqlite:${DATA_DIR:./data}/broadcast.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA busy_timeout=15000
  flyway:
    enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: false
app:
  storage: sqlite
  data-dir: ${DATA_DIR:./data}
  submissions-per-minute: ${SUBMISSIONS_PER_MINUTE:20}
  trusted-proxies: ${TRUSTED_PROXY_CIDRS:}
