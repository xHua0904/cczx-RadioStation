server:
  port: ${PORT:8000}
  address: ${BIND_ADDRESS:127.0.0.1}
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  tomcat:
    threads:
      max: 50
      min-spare: 5
    max-connections: 200
    accept-count: 50
    connection-timeout: 10s
    max-swallow-size: 64KB
spring:
  application:
    name: cczx-RadioStation
  datasource:
    url: ${DB_URL:jdbc:sqlite:${DATA_DIR:./data}/broadcast.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA busy_timeout=15000
  flyway:
    enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: false
app:
  storage: sqlite
  data-dir: ${DATA_DIR:./data}
  secrets-dir: ${SECRETS_DIR:./secrets}
  admin-password: ${BROADCAST_ADMIN_PASSWORD:cczx123456}
  trusted-proxies: ${TRUSTED_PROXY_CIDRS:}
  require-https: ${REQUIRE_HTTPS:false}
  submissions-per-minute: ${SUBMISSIONS_PER_MINUTE:20}
  session-max-age-seconds: 7200
  session-idle-seconds: 1800
