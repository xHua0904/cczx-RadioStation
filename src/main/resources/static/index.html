<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园点播 · 长春中学广播站</title>
<meta name="description" content="向长春中学校园广播点播歌曲，附上简短寄语与点播理由。">
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="css/style.css?v=@assets.version@">
<link rel="stylesheet" href="css/workspace.css?v=@assets.version@">
<link rel="stylesheet" href="css/glass.css?v=@assets.version@">
</head>
<body class="page-public">
<a class="skip" href="#form">跳到点播表单</a>
<header class="site-head"><div class="wrap head-inner"><a class="brand" href="index.html"><img src="img/logo.png" alt="长春中学校徽"><span class="brand-text"><strong>校园广播站</strong><em>长春中学</em></span></a><nav class="head-nav" aria-label="导航"><a class="ghost-link" href="admin.html">新媒体中心</a></nav></div></header>
<main class="public-main">
  <div class="page-head"><div><span class="eyebrow">长春中学 · 校园广播</span><h1>把想听的歌，送到校园广播</h1><p>选择一首歌，也可以留下简短寄语和点播理由</p></div><span class="page-marker">点播申请</span></div>
  <div class="public-layout">
    <div class="card form-card" id="form">
      <div class="form-title"><h2 class="form-heading">提交点播</h2><span>标有 * 的项目为必填</span></div>
      <form id="submitForm" novalidate>
        <div class="alert" id="formAlert" role="alert"></div>
        <fieldset class="form-section"><legend>投稿人</legend><div class="row-2">
          <div class="field" data-field="author"><label for="author">姓名<span class="req">*</span></label><input class="input" id="author" name="author" maxlength="20" placeholder="真实姓名" autocomplete="name" required></div>
          <div class="field" data-field="class_name"><label for="class_name">班级<span class="req">*</span></label><select class="select" id="class_name" name="class_name" required>
            <option value="" selected disabled>请选择班级</option>
            <optgroup label="高一">
              <option value="高一1班">高一1班</option>
              <option value="高一2班">高一2班</option>
              <option value="高一3班">高一3班</option>
              <option value="高一4班">高一4班</option>
              <option value="高一5班">高一5班</option>
              <option value="高一6班">高一6班</option>
              <option value="高一7班">高一7班</option>
              <option value="高一8班">高一8班</option>
              <option value="高一9班">高一9班</option>
              <option value="高一10班">高一10班</option>
              <option value="高一11班">高一11班</option>
            </optgroup>
            <optgroup label="高二">
              <option value="高二1班">高二1班</option>
              <option value="高二2班">高二2班</option>
              <option value="高二3班">高二3班</option>
              <option value="高二4班">高二4班</option>
              <option value="高二5班">高二5班</option>
              <option value="高二6班">高二6班</option>
              <option value="高二7班">高二7班</option>
              <option value="高二8班">高二8班</option>
              <option value="高二9班">高二9班</option>
            </optgroup>
          </select></div>
        </div></fieldset>
        <fieldset class="form-section"><legend>点播信息</legend><div class="row-2">
          <div class="field" data-field="song_name"><label for="song_name">点播歌曲名称<span class="req">*</span></label><input class="input" id="song_name" name="song_name" maxlength="80" placeholder="歌曲名称" required></div>
          <div class="field" data-field="artist"><label for="artist">歌手<span class="req">*</span></label><input class="input" id="artist" name="artist" maxlength="80" placeholder="歌手或演唱者" required></div>
        </div></fieldset>
        <fieldset class="form-section"><legend>想说的话<span class="section-optional">选填</span></legend><div class="row-2">
          <div class="field" data-field="message"><label for="message">简短寄语</label><textarea class="textarea request-textarea" id="message" name="message" maxlength="100" rows="3" placeholder="留一句想送给大家的话"></textarea><div class="field-foot"><span>最多 100 字</span><span class="counter" id="messageCounter">0 / 100</span></div></div>
          <div class="field" data-field="reason"><label for="reason">点播理由</label><textarea class="textarea request-textarea" id="reason" name="reason" maxlength="300" rows="3" placeholder="为什么想点播这首歌"></textarea><div class="field-foot"><span>最多 300 字</span><span class="counter" id="reasonCounter">0 / 300</span></div></div>
        </div></fieldset>
        <div class="field" data-field="contact"><label for="contact">联系方式<span class="opt">选填</span></label><input class="input" id="contact" name="contact" maxlength="50" placeholder="微信 / QQ / 手机号"></div>
        <div class="submit-row"><p class="form-tip">提交后由新媒体中心审核并安排播出</p><button class="btn btn-primary" type="submit" id="submitBtn" disabled><span id="submitLabel">提交点播</span></button></div>
      </form>
      <div class="success" id="successPanel"><div class="success-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m5 12 4 4L19 6"/></svg></div><h3>点播已提交</h3><p>你的申请编号：<strong id="submissionCode"></strong></p><p>新媒体中心会查看这份申请，需要补充信息时会通过预留方式联系你</p><div class="actions"><button class="btn btn-ghost btn-sm" type="button" id="againBtn">再点播一首</button></div></div>
    </div>
    <aside class="announcement-board" aria-labelledby="announcementHeading">
      <section class="card request-preview" aria-labelledby="previewHeading"><div class="record-disc" aria-hidden="true"><span>广播</span></div><div class="preview-copy"><span class="eyebrow" id="previewHeading">本次点播</span><h2 id="previewSong">歌曲名称</h2><p id="previewArtist">歌手</p></div></section>
      <div class="board-heading"><div><span class="eyebrow">新媒体中心</span><h2 id="announcementHeading">公告栏</h2></div><span class="board-count" id="announcementCount">—</span></div>
      <div id="announcementFeed" class="announcement-feed" aria-live="polite"><p class="empty-state">正在加载公告…</p></div><button id="announcementRetry" class="btn btn-ghost btn-sm" type="button" hidden>重新加载公告</button>
    </aside>
  </div>
</main>
<footer class="site-credit" aria-label="网站署名">
  <strong>长春中学新媒体中心</strong>
  <p>by网络部x长春中学科创社</p>

  </a>
</footer>
<script src="js/submit.js?v=@assets.version@"></script>
</body>
</html>
